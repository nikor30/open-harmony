; IR/RF gateway firmware for the Kincony KC868-AG (ESP32), part of open-harmony.
; Build: pio run          Flash (USB): pio run -t upload
[env:kc868ag]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/embed_web.py
build_flags =
	-I${sysenv.HOME}/.config/open-harmony
	-DCORE_DEBUG_LEVEL=0
	-DFW_VERSION=\"0.1.2\"
lib_deps =
	crankyoldgit/IRremoteESP8266@^2.8.6
	sui77/rc-switch@^2.6.4
	bblanchon/ArduinoJson@^7.2.0
	knolleary/PubSubClient@^2.8
	mathieucarbou/ESPAsyncWebServer@^3.3.0

; Over Wi-Fi: pio run -e ota -t upload   (password from ~/.config/open-harmony/open_harmony_secrets.h)
[env:ota]
extends = env:kc868ag
upload_protocol = espota
upload_port = ir-gateway.local
extra_scripts =
	pre:tools/embed_web.py
	pre:tools/ota_auth.py
